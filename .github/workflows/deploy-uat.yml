name: Deploy Backend (UAT)

on:
  push:
    branches:
      - uat
      - UAT
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      iis_site_path:
        description: 'Target IIS Site Directory for UAT'
        required: false
        default: 'C:\inetpub\wwwroot\SMSAPI_UAT'
      app_pool_name:
        description: 'Target Application Pool / Service Name'
        required: false
        default: 'Plexoc_UAT'

jobs:
  deploy:
    name: Deploy to UAT IIS
    runs-on: [self-hosted, windows]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute UAT Backend Deployment
        shell: powershell
        run: |
          $sitePath = "${{ github.event.inputs.iis_site_path }}"
          if ([string]::IsNullOrWhiteSpace($sitePath)) {
            $sitePath = "C:\inetpub\wwwroot\SMSAPI_UAT"
          }

          $appPool = "${{ github.event.inputs.app_pool_name }}"
          if ([string]::IsNullOrWhiteSpace($appPool)) {
            $appPool = "Plexoc_UAT"
          }

          Write-Host "=========================================================="
          Write-Host " Triggering SMS Backend UAT IIS Deployment via GitHub Actions"
          Write-Host " Environment:     UAT"
          Write-Host " Target IIS Path: $sitePath"
          Write-Host " Service/AppPool: $appPool"
          Write-Host " Branch:          ${{ github.ref_name }}"
          Write-Host " Protected:       appsettings.json, appsettings.*.json, web.config"
          Write-Host " Backup:          C:\inetpub\wwwroot\Backups"
          Write-Host "=========================================================="

          $deployParams = @{
            SkipGitPull  = $true
            Environment  = "UAT"
            TargetBranch = "${{ github.ref_name }}"
            IisSitePath  = $sitePath
            AppPoolName  = $appPool
          }

          .\deploy\deploy.ps1 @deployParams
