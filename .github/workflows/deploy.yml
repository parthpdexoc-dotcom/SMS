name: Deploy Backend to IIS

on:
  push:
    branches:
      - develop
      - Develop
      - uat
      - UAT
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment'
        required: true
        type: choice
        options:
          - Dev
          - UAT
          - Prod
        default: 'Dev'
      iis_site_path:
        description: 'Override Target IIS Site Directory (leave blank for environment default)'
        required: false
        default: ''
      app_pool_name:
        description: 'Override IIS Application Pool / Service Name (leave blank for environment default)'
        required: false
        default: ''
      skip_deployment:
        description: 'Build and validate only (do not deploy to IIS)'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: [self-hosted, windows]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Backend Deployment
        shell: powershell
        run: |
          $branch = "${{ github.ref_name }}"
          $envName = "${{ github.event.inputs.environment }}"
          if ([string]::IsNullOrWhiteSpace($envName)) {
            if ($branch -match "uat") {
              $envName = "UAT"
            } elseif ($branch -in @("main", "master", "prod", "production")) {
              $envName = "Prod"
            } else {
              $envName = "Dev"
            }
          }

          $sitePath = "${{ github.event.inputs.iis_site_path }}"
          $appPool = "${{ github.event.inputs.app_pool_name }}"

          Write-Host "=========================================================="
          Write-Host " Triggering SMS Backend IIS Deployment via GitHub Actions"
          Write-Host " Environment:     $envName"
          Write-Host " Branch:          $branch"
          if (-not [string]::IsNullOrWhiteSpace($sitePath)) {
            Write-Host " Custom IIS Path: $sitePath"
          }
          if (-not [string]::IsNullOrWhiteSpace($appPool)) {
            Write-Host " Custom Service:  $appPool"
          }
          Write-Host " Protected Files: appsettings.json, appsettings.*.json, web.config"
          Write-Host "=========================================================="

          $deployParams = @{
            SkipGitPull  = $true
            Environment  = $envName
            TargetBranch = $branch
          }
          if (-not [string]::IsNullOrWhiteSpace($sitePath)) {
            $deployParams["IisSitePath"] = $sitePath
          }
          if (-not [string]::IsNullOrWhiteSpace($appPool)) {
            $deployParams["AppPoolName"] = $appPool
          }

          .\deploy\deploy.ps1 @deployParams
